<iframe width="396" height="700" src="https://www.youtube.com/embed/gMGHglQecOo"
  title="Sue&#39;s House - Ilford - test video" frameborder="0"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

  <style>
    .counter-box {
      text-align: center;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    .counter-number {
      font-size: 48px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>

  <div class="counter-box">
    <p>Page views:</p>
    <span class="counter-number" id="count">0</span>
  </div>

  <script>
    let count = localStorage.getItem('page_view');
    if (count) {
      count = Number(count) + 1;
    } else {
      count = 1;
    }
    localStorage.setItem('page_view', count);
    document.getElementById('count').innerText = count;
  </script>
</body>
