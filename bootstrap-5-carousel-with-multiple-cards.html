<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bootstrap 5 carousel with multiple cards</title>

  <!-- Bootstrap 5 -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
    crossorigin="anonymous"
  />
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <!-- Font Awesome (used by many legacy snippets) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css"
  />
  <!-- jQuery (used by a few legacy snippets) -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

  <style>
    #myCarousel {
        margin-top:50px;
    }
    @d-flex (max-width: 768px) {
      .carousel-inner .carousel-item > div {
        display: none;
      }

      .carousel-inner .carousel-item > div:first-child {
        display: block;
      }
    }
    .carousel-inner .carousel-item.active,
    .carousel-inner .carousel-item-start,
    .carousel-inner .carousel-item-next,
    .carousel-inner .carousel-item-prev {
      display: flex;
    }

    @d-flex (min-width: 768px) {
      .carousel-inner .carousel-item-right.active,
    .carousel-inner .carousel-item-next,
    .carousel-item-next:not(.carousel-item-start) {
        transform: translateX(25%) !important;
      }

      .carousel-inner .carousel-item-left.active,
    .carousel-item-prev:not(.carousel-item-end),
    .active.carousel-item-start,
    .carousel-item-prev:not(.carousel-item-end) {
        transform: translateX(-25%) !important;
      }

      .carousel-item-next.carousel-item-start, .active.carousel-item-end {
        transform: translateX(0) !important;
      }

      .carousel-inner .carousel-item-prev,
    .carousel-item-prev:not(.carousel-item-end) {
        transform: translateX(-25%) !important;
      }
    }
  </style>
</head>
<body>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <div id="myCarousel" class="carousel slide container" data-bs-ride="carousel">
    <div class="carousel-inner w-100">
      <div class="carousel-item active">
        <div class="col-md-3">
          <div class="card card-body">
            <img class="img-fluid" src="https://via.placeholder.com/640x360?text=1">

          </div>
        </div>
      </div>
      <div class="carousel-item">
        <div class="col-md-3">
          <div class="card card-body">
            <img class="img-fluid" src="https://via.placeholder.com/640x360?text=2">
          </div>
        </div>
      </div>
      <div class="carousel-item">
        <div class="col-md-3">
                   <h2 class="card-h1">
            test
          </h2>

          <div class="team-imageright">
            <img src="images/pic6.jpg" alt="Cheryl Sinnott">
          </div>

          <p class="team-p team-text">
            Lorem ipsum dolor sit amet, consectetur adipisicing elit. 
          </p>

        </div>
      </div>
        </div>
      
      <div class="carousel-item">
        <div class="col-md-3">
          <div class="card card-body">
            <img class="img-fluid" src="https://via.placeholder.com/640x360?text=4">
          </div>
        </div>
      </div>
      <div class="carousel-item">
        <div class="col-md-3">
          <div class="card card-body">
            <img class="img-fluid" src="https://via.placeholder.com/640x360?text=5">
          </div>
        </div>
      </div>
      <div class="carousel-item">
        <div class="col-md-3">
          <div class="card card-body">
            <img class="img-fluid" src="https://via.placeholder.com/640x360?text=6">
          </div>
        </div>
      </div>
      <div class="carousel-item">
        <div class="col-md-3">
          <div class="card card-body">
            <img class="img-fluid" src="https://via.placeholder.com/640x360?text=7">
          </div>
        </div>
      </div>
	  
	  
      <div class="carousel-item">
        <div class="col-md-3">
          <div class="card card-body">
            <img class="img-fluid" src="https://via.placeholder.com/640x360?text=8">
          </div>
        </div>
      </div>
    </div>
	
	
	
    <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js'></script>

  <!-- Bootstrap 5 bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    $('.carousel .carousel-item').each(function () {
      var minPerSlide = 4;
      var next = $(this).next();
      if (!next.length) {
        next = $(this).siblings(':first');
      }
      next.children(':first-child').clone().appendTo($(this));

      for (var i = 0; i < minPerSlide; i++) {
        next = next.next();
        if (!next.length) {
          next = $(this).siblings(':first');
        }

        next.children(':first-child').clone().appendTo($(this));
      }
    });
  </script>
</body>
</html>
